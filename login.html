<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Acesso Restrito</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; }
    .box { background:#222; padding:30px; border-radius:10px; }
    input { width:100%; padding:10px; margin-top:10px; }
    button { margin-top:10px; padding:10px; width:100%; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Autenticação</h2>
    <input id="key" type="password" placeholder="Insere a chave">
    <button onclick="login()">Entrar</button>
    <p id="msg"></p>
  </div>

  <script>
    const VALID_KEY = "1234"; // <-- muda isto

    function login() {
      const k = document.getElementById("key").value;
      if (k === VALID_KEY) {
        localStorage.setItem("authKey", k);
        window.location.href = "index.html";
      } else {
        document.getElementById("msg").innerText = "Chave inválida.";
      }
    }
  </script>
</body>
</html>
