<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Massagens — Acesso</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px; color:#f5f0e7; background:radial-gradient(circle at 20% 0,rgba(47,111,157,.23),transparent 34%),radial-gradient(circle at 90% 90%,rgba(217,170,85,.16),transparent 30%),#070a0f; }
    .box { width:min(100%,390px); padding:30px; border:1px solid rgba(240,207,136,.16); border-radius:24px; background:linear-gradient(150deg,rgba(22,32,43,.97),rgba(14,21,30,.98)); box-shadow:0 24px 70px rgba(0,0,0,.45); }
    .eyebrow { display:block; margin-bottom:6px; color:#f0cf88; font-size:.72rem; font-weight:750; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font-size:1.75rem; }
    .intro { margin:8px 0 24px; color:#a9b0b8; font-size:.92rem; line-height:1.5; }
    fieldset { min-width:0; margin:0 0 20px; padding:0; border:0; }
    legend,.field-label { display:block; margin-bottom:9px; color:#d9dde2; font-size:.82rem; font-weight:700; }
    .user-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .user-option { position:relative; cursor:pointer; }
    .user-option input { position:absolute; opacity:0; pointer-events:none; }
    .user-card { display:grid; justify-items:center; gap:7px; min-height:88px; padding:14px 8px; border:1px solid rgba(255,255,255,.09); border-radius:16px; background:rgba(255,255,255,.035); transition:.18s ease; }
    .user-avatar { display:grid; place-items:center; width:42px; height:42px; border-radius:50%; color:#10151c; background:#d9aa55; font-size:1rem; font-weight:850; }
    .user-option input:checked + .user-card { border-color:rgba(240,207,136,.65); background:rgba(217,170,85,.12); box-shadow:0 0 0 2px rgba(217,170,85,.08); }
    .user-option input[value="admin"] + .user-card .user-avatar { color:#eaf7f5; background:#2f6f9d; }
    .user-option input:focus-visible + .user-card { outline:2px solid #f0cf88; outline-offset:3px; }
    #key { width:100%; padding:13px 14px; border:1px solid rgba(255,255,255,.1); border-radius:12px; color:#fff; background:rgba(0,0,0,.24); }
    #key:focus { outline:2px solid #f0cf88; outline-offset:2px; }
    button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:12px; color:#10151c; background:linear-gradient(135deg,#f0cf88,#d9aa55); font-weight:800; cursor:pointer; }
    #msg { min-height:1.25em; margin:12px 0 0; color:#ff9b9b; font-size:.84rem; text-align:center; }
  </style>
</head>
<body>
  <main class="box">
    <span class="eyebrow">Acesso privado</span>
    <h1>Massagens</h1>
    <p class="intro">Escolha um utilizador ou entre diretamente na área de administração dos dois perfis.</p>
    <form id="loginForm">
      <fieldset>
        <legend>Selecionar utilizador</legend>
        <div class="user-grid">
          <label class="user-option">
            <input type="radio" name="user" value="pai" checked>
            <span class="user-card"><span class="user-avatar">P</span><strong>Pai</strong></span>
          </label>
          <label class="user-option">
            <input type="radio" name="user" value="mae">
            <span class="user-card"><span class="user-avatar">M</span><strong>Mãe</strong></span>
          </label>
          <label class="user-option">
            <input type="radio" name="user" value="admin">
            <span class="user-card"><span class="user-avatar">A</span><strong>Admin</strong></span>
          </label>
        </div>
      </fieldset>
      <label class="field-label" for="key">Chave de acesso</label>
      <input id="key" type="password" placeholder="Insira a chave" autocomplete="current-password" required>
      <button id="loginButton" type="submit">Entrar</button>
      <p id="msg" role="alert"></p>
    </form>
  </main>
  <script>
    const VALID_KEY = '01123456';
    const ACTIVE_USER_KEY = 'massageCreditsUser_v1';

    function login() {
      const k = document.getElementById('key').value;
      const selectedUser = document.querySelector('input[name="user"]:checked')?.value;
      if (k === VALID_KEY) {
        localStorage.setItem('authKey', k);
        localStorage.setItem(ACTIVE_USER_KEY, selectedUser);
        window.location.href = 'index.html';
      } else {
        document.getElementById('msg').innerText = 'Chave inválida.';
      }
    }

    const previousUser = localStorage.getItem(ACTIVE_USER_KEY);
    const previousOption = ['pai', 'mae', 'admin'].includes(previousUser)
      ? document.querySelector(`input[name="user"][value="${previousUser}"]`)
      : null;
    if (previousOption) previousOption.checked = true;

    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      login();
    });
  </script>
</body>
</html>
